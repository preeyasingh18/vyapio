# ─────────────────────────────────────────────────────────────────────────────
# Serving the built app, and putting the API on the same origin.
#
# This mirrors what CloudFront does in production: one origin, /api routed to
# the backend. Keeping the shape identical means the client uses the same
# relative URLs in both places and there is no CORS to configure locally.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API, reachable by service name inside the compose network.
    #
    # The trailing slash on the target strips the /api prefix, which is what
    # the Vite dev proxy does too. The API serves its routes at the root, so
    # forwarding the prefix intact would 404 every call.
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Voice upload and the assistant both take longer than a page load.
        proxy_read_timeout 120s;
    }

    # Hashed filenames, so these can be cached hard and for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must not be cached, or a browser keeps serving the old
    # one and the app never updates.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # A single-page app: every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
